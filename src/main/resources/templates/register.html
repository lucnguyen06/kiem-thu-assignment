<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang ky</title>
</head>
<body>
<h1>Dang ky</h1>
<p id="error" th:if="${error}" th:text="${error}" role="alert"></p>
<form method="post" th:action="@{/register}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" th:value="${username}">
    <label for="email">Email</label>
    <input id="email" name="email" type="text" th:value="${email}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <button id="register-btn" type="submit">Dang ky</button>
</form>
<a id="login-link" th:href="@{/login}">Dang nhap</a>
</body>
</html>
