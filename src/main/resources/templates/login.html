<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dang nhap</title>
</head>
<body>
<h1>Dang nhap</h1>
<p id="msg-registered" th:if="${param.registered}">Dang ky thanh cong, hay dang nhap</p>
<p id="msg-logout" th:if="${param.logout}">Ban da dang xuat</p>
<p id="error" th:if="${error}" th:text="${error}" role="alert"></p>
<form method="post" th:action="@{/login}">
    <label for="username">Username</label>
    <input id="username" name="username" type="text">
    <label for="password">Password</label>
    <input id="password" name="password" type="password">
    <button id="login-btn" type="submit">Dang nhap</button>
</form>
<a id="register-link" th:href="@{/register}">Dang ky</a>
</body>
</html>
