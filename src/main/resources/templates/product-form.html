<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form san pham</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .form-card {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            padding: 36px 32px;
            position: relative;
            overflow: hidden;
        }

        .form-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #4f46e5, #06b6d4);
        }

        .form-header {
            margin-bottom: 28px;
        }

        .form-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--primary-light);
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            color: var(--text-main);
            background: #f8fafc;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        .field-error {
            display: block;
            color: var(--danger);
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            background: var(--danger-bg);
            padding: 6px 10px;
            border-radius: 6px;
            border-left: 3px solid var(--danger);
        }

        .button-group {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 30px;
        }

        #save-btn {
            flex: 1;
            padding: 12px 20px;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease;
        }

        #save-btn:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(79, 70, 229, 0.35);
        }

        #cancel-link {
            padding: 12px 24px;
            background: #f1f5f9;
            color: var(--text-muted);
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
            text-align: center;
        }

        #cancel-link:hover {
            background: #e2e8f0;
            color: var(--text-main);
        }
    </style>
</head>
<body>

<div class="form-card">
    <div class="form-header">
        <span class="form-badge">📦 Sản phẩm</span>
        <h1 th:text="${product.id == null} ? 'Them san pham' : 'Sua san pham'"></h1>
    </div>

    <form method="post"
          th:action="${product.id == null} ? @{/products} : @{/products/{id}(id=${product.id})}"
          th:object="${product}">
        <div class="form-group">
            <label for="name">Ten</label>
            <input id="name" name="name" type="text" placeholder="Nhập tên sản phẩm..." th:value="*{name}">
            <span class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-group">
            <label for="price">Gia</label>
            <input id="price" name="price" type="number" placeholder="Tối thiểu 1..." th:value="*{price}">
            <span class="field-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></span>
        </div>

        <div class="form-group">
            <label for="quantity">So luong</label>
            <input id="quantity" name="quantity" type="number" placeholder="Tối thiểu 0..." th:value="*{quantity}">
            <span class="field-error" th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"></span>
        </div>

        <div class="button-group">
            <button id="save-btn" type="submit">Luu</button>
            <a id="cancel-link" th:href="@{/products}">Huy</a>
        </div>
    </form>
</div>

</body>
</html>
