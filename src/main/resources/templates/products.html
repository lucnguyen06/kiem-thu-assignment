<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>San pham</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-page: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --danger-light: #fee2e2;
            --success: #10b981;
            --success-light: #d1fae5;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Navigation */
        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .navbar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #f1f5f9;
            border-radius: 9999px;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
        }

        .user-avatar {
            width: 24px;
            height: 24px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        #current-user {
            font-weight: 700;
            color: var(--primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: #ffffff;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #4338ca 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.35);
        }

        .btn-outline-danger {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger-light);
            padding: 7px 14px;
        }

        .btn-outline-danger:hover {
            background: var(--danger-light);
            color: var(--danger-hover);
        }

        /* Main Content Container */
        .main-container {
            max-width: 1140px;
            width: 100%;
            margin: 36px auto;
            padding: 0 24px;
            flex: 1;
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Data Card */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        thead {
            background: #f8fafc;
            border-bottom: 1.5px solid var(--border);
        }

        th {
            padding: 14px 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-muted);
        }

        tbody tr {
            border-bottom: 1px solid var(--border-light);
            transition: background-color 0.15s ease;
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background-color: #f8fafc;
        }

        td {
            padding: 16px 20px;
            color: var(--text-main);
            vertical-align: middle;
        }

        .p-name {
            font-weight: 600;
            color: #1e293b;
        }

        .p-price {
            font-weight: 600;
            color: var(--primary);
            font-variant-numeric: tabular-nums;
        }

        .p-qty {
            font-weight: 600;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            font-variant-numeric: tabular-nums;
        }

        /* Action Buttons */
        .actions-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-link {
            padding: 6px 14px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
        }

        .edit-link:hover {
            background: #c7d2fe;
            color: var(--primary-hover);
        }

        .delete-btn {
            padding: 6px 14px;
            background: #fee2e2;
            color: var(--danger);
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
        }

        .delete-btn:hover {
            background: #fecaca;
            color: var(--danger-hover);
        }

        /* Empty State */
        .empty-state {
            padding: 60px 20px;
            text-align: center;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .empty-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }
    </style>
</head>
<body>

<!-- Navbar Header -->
<nav class="navbar">
    <div class="navbar-brand">
        <div class="brand-icon">🛍️</div>
        <span>Shop ASM Dashboard</span>
    </div>

    <div class="nav-actions">
        <p class="user-badge">
            <span class="user-avatar">👤</span>
            Xin chao, <span id="current-user" th:text="${currentUser}"></span>
        </p>
        <a id="add-link" class="btn btn-primary" th:href="@{/products/new}">+ Them san pham</a>
        <a id="logout-link" class="btn btn-outline-danger" th:href="@{/logout}">Dang xuat</a>
    </div>
</nav>

<!-- Main Container -->
<main class="main-container">
    <div class="page-header">
        <h1>Danh sach san pham</h1>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table id="product-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Ten</th>
                    <th>Gia</th>
                    <th>So luong</th>
                    <th>Thao tac</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${products}" th:attr="data-name=${p.name}">
                    <td th:text="${p.id}"></td>
                    <td class="p-name" th:text="${p.name}"></td>
                    <td class="p-price" th:text="${p.price}"></td>
                    <td class="p-qty" th:text="${p.quantity}"></td>
                    <td>
                        <div class="actions-cell">
                            <a class="edit-link" th:href="@{/products/{id}/edit(id=${p.id})}">Sua</a>
                            <form style="display:inline" method="post" th:action="@{/products/{id}/delete(id=${p.id})}">
                                <button class="delete-btn" type="submit">Xoa</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(products)}">
                    <td colspan="5">
                        <div class="empty-state">
                            <div class="empty-icon">📦</div>
                            <div class="empty-title">Chưa có sản phẩm nào</div>
                            <p>Bấm nút <strong>"+ Them san pham"</strong> ở trên để tạo sản phẩm đầu tiên của bạn.</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

</body>
</html>
