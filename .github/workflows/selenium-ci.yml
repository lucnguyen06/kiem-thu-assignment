name: Selenium CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      test_group:
        description: "Nhom test UI can chay (de trong = chay tat ca)"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - regression
          - all

jobs:
  unit-tests:
    name: JUnit 5 (unit + controller)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run JUnit tests
        run: mvn -B test
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: target/surefire-reports/

  ui-tests:
    name: Selenium + TestNG (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      fail-fast: false
      matrix:
        # push/PR: chay smoke; chay tay: theo lua chon cua nguoi dung
        group: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', github.event.inputs.test_group) || '["smoke"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Thong bao nhom test
        run: echo "Dang chay nhom UI test = ${{ matrix.group }}"
      - name: Run Selenium tests
        run: |
          if [ "${{ matrix.group }}" = "all" ]; then
            mvn -B test -Pui
          else
            mvn -B test -Pui -Dgroups=${{ matrix.group }}
          fi
      - name: Upload TestNG report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-report-${{ matrix.group }}
          path: target/surefire-reports/
      - name: Ket qua
        if: always()
        run: echo "Job UI (${{ matrix.group }}) ket thuc voi trang thai ${{ job.status }}"
